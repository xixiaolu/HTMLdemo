<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b1020;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 50vh;
            background: linear-gradient(180deg, #07111d 0%, #0e1b2a 100%);
        }

        audio {
            width: min(700px, 90vw);
        }
    </style>
</head>

<body>
    <canvas></canvas>
    <audio src="./音频/奢香夫人 (Live)-凤凰传奇.mp3" controls></audio>
</body>
<script>
    const audioEle = document.querySelector('audio');
    const cvs = document.querySelector('canvas');
    const ctx = cvs.getContext('2d');

    function initCvs() {
        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight * 0.5;

        cvs.width = Math.floor(width * dpr);
        cvs.height = Math.floor(height * dpr);
        cvs.style.width = `${width}px`;
        cvs.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    initCvs();
    window.addEventListener('resize', initCvs);

    let isInit = false;
    let analyser = null;
    let buffer = null;

    audioEle.addEventListener('play', async () => {
        if (isInit) return;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        const source = audioCtx.createMediaElementSource(audioEle);
        analyser = audioCtx.createAnalyser();

        source.connect(analyser);
        analyser.fftSize = 512;
        buffer = new Uint8Array(analyser.frequencyBinCount);
        analyser.connect(audioCtx.destination);

        isInit = true;
    });

    function draw() {
        requestAnimationFrame(draw);
        if (!isInit || !analyser || !buffer) return;

        const width = cvs.clientWidth;
        const height = cvs.clientHeight;
        ctx.clearRect(0, 0, width, height);
        analyser.getByteFrequencyData(buffer);

        const dataLength = Math.min(Math.floor(buffer.length * 0.5), 120);
        const barWidth = width / (dataLength * 2);

        for (let i = 0; i < dataLength; i++) {
            const v = buffer[i];
            const barHeight = (v / 255) * height;
            const x1 = width / 2 + i * barWidth;
            const x2 = width / 2 - (i + 1) * barWidth;
            const y = height - barHeight;

            ctx.fillStyle = `hsl(${(i / dataLength) * 360}, 100%, 60%)`;
            ctx.fillRect(x1, y, Math.max(barWidth - 2, 1), barHeight);
            ctx.fillRect(x2, y, Math.max(barWidth - 2, 1), barHeight);
        }
    }

    draw();
</script>

</html>
